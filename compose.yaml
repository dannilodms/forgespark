# Development: the services that the API and the app, which run on the
# machine, talk to. Each one extends deploy/compose.base.yaml, which holds the
# tag of every image. Rules: Compose files and Development in
# CODING_STANDARDS.md.
#
# The name is fixed so that every checkout of the repository, a Git worktree
# included, drives the same containers and volumes. Compose creates a
# container again when `up` runs from another directory and the container
# mounts a file of the checkout, because the path differs. PostgreSQL mounts
# none, so that its connections survive: the file it needs is written here, as
# a config with its content. Garage does the same, so that an upload in flight
# survives. Caddy mounts its Caddyfile, and being created again costs it
# nothing.

name: software-factory-manager

services:
  postgres:
    extends:
      file: deploy/compose.base.yaml
      service: postgres
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT, as .env.example does}:5432

  # The one origin of development: the app from Vite and the API, both on the
  # machine, and /up. What it does is in deploy/Caddyfile.
  caddy:
    extends:
      file: deploy/compose.base.yaml
      service: caddy
    build:
      context: deploy/caddy
    image: software-factory-manager-caddy:development
    depends_on:
      # The host name of the files leads to a bucket that has its rule.
      # `up --wait` refuses a step that exited unless a service waits for it.
      garage-cors:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${CADDY_PORT:?Set CADDY_PORT, as .env.example does}:80
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      # The API and Vite listen on the machine. Docker Desktop and Docker
      # Engine on Linux each resolve host-gateway to an address of it.
      - host.docker.internal:host-gateway
    environment:
      # Caddy starts the trace of each request but exports nothing until the
      # telemetry containers exist. With no exporter named, it would send to
      # localhost and log each failure.
      OTEL_TRACES_EXPORTER: none

  # The file storage: the S3 API of Garage, on one node. The API reaches it on
  # the machine at GARAGE_PORT; the browser reaches it at its own host name,
  # through Caddy. When it starts, Garage creates the one bucket and its key
  # from the variables of the API, if they do not exist yet.
  garage:
    extends:
      file: deploy/compose.base.yaml
      service: garage
    command: [/garage, server, --single-node, --default-bucket]
    ports:
      - 127.0.0.1:${GARAGE_PORT:?Set GARAGE_PORT, as .env.example does}:3900
    configs:
      - source: garage
        target: /etc/garage.toml
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET, as .env.example does}
      GARAGE_DEFAULT_BUCKET: ${FILE_STORAGE_BUCKET:?Set FILE_STORAGE_BUCKET, as .env.example does}
      GARAGE_DEFAULT_ACCESS_KEY: ${FILE_STORAGE_ACCESS_KEY_ID:?Set FILE_STORAGE_ACCESS_KEY_ID, as .env.example does}
      GARAGE_DEFAULT_SECRET_KEY: ${FILE_STORAGE_SECRET_ACCESS_KEY:?Set FILE_STORAGE_SECRET_ACCESS_KEY, as .env.example does}
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      # The image has no shell: Garage itself tells whether the bucket exists.
      test: [CMD, /garage, bucket, info, "${FILE_STORAGE_BUCKET}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # The cross-origin rule of the bucket: the browser may send and fetch files
  # from the origin of the app only. Run again, it writes the same rule.
  garage-cors:
    extends:
      file: deploy/compose.base.yaml
      service: garage-cors
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: [sh, /garage-cors.sh]
    configs:
      - source: garage-cors
        target: /garage-cors.sh
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN, as .env.example does}
      FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:?Set FILE_STORAGE_REGION, as .env.example does}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET}
      FILE_STORAGE_ACCESS_KEY_ID: ${FILE_STORAGE_ACCESS_KEY_ID}
      FILE_STORAGE_SECRET_ACCESS_KEY: ${FILE_STORAGE_SECRET_ACCESS_KEY}

  # The seed (ADR-0019): fills an empty database with a fictitious consultancy
  # and its administrator, through the use cases of the setup. In development
  # `task seed` runs the Go package on the machine, as `task migrate` does;
  # this service is the image staging runs on every publish, declared here so
  # that development builds and proves it, and in no other environment but
  # staging. It runs once and exits, so it lives in a profile of its own and
  # `task services` does not start it:
  # `docker compose --profile seed run --rm --build seed`.
  seed:
    extends:
      file: deploy/compose.base.yaml
      service: seed
    build:
      context: apps/api
      dockerfile: cmd/seed/Dockerfile
    image: software-factory-manager-seed:development
    profiles: [seed]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The API role, on the network of Compose. The migrations were applied
      # from the machine, by `task migrate`.
      DATABASE_URL: postgres://api:${POSTGRES_API_PASSWORD:?Set POSTGRES_API_PASSWORD, as .env.example does}@postgres:5432/software_factory?sslmode=disable
      SEED_MAILBOX: ${SEED_MAILBOX:?Set SEED_MAILBOX, as .env.example does}

  # The e-mail of development: the worker sends over SMTP to MAILPIT_SMTP_PORT
  # of the machine, and Mailpit keeps every e-mail, delivering none. Its
  # screen and its API, through which the tests read an e-mail back, are at
  # MAILPIT_PORT.
  mailpit:
    extends:
      file: deploy/compose.base.yaml
      service: mailpit
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:?Set MAILPIT_SMTP_PORT, as .env.example does}:1025
      - 127.0.0.1:${MAILPIT_PORT:?Set MAILPIT_PORT, as .env.example does}:8025

  # The River panel, in development only: it reads and manages the jobs of
  # the development database as the API role, on a port of the machine.
  riverui:
    extends:
      file: deploy/compose.base.yaml
      service: riverui
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${RIVER_PANEL_PORT:?Set RIVER_PANEL_PORT, as .env.example does}:8080
    environment:
      DATABASE_URL: postgres://api:${POSTGRES_API_PASSWORD}@postgres:5432/software_factory?sslmode=disable

volumes:
  postgres-data:
  garage-data:

configs:
  # One node, which keeps its data in the volume and holds every copy. The
  # secret its nodes share comes from the environment. Path-style addresses
  # only: no root domain is set, so a bucket is never read from a host name.
  # It listens on IPv4, which a container has wherever Docker runs.
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "0.0.0.0:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "${FILE_STORAGE_REGION}"
      api_bind_addr = "0.0.0.0:3900"

  # PutBucketCors of the S3 API, signed with the key of the API. A browser
  # asks before it sends a file to another origin; Garage answers 403 to an
  # origin the rule does not list, and the browser sends nothing.
  garage-cors:
    content: |
      set -eu
      rule="<CORSConfiguration><CORSRule>
        <AllowedOrigin>$${APP_ORIGIN}</AllowedOrigin>
        <AllowedMethod>PUT</AllowedMethod>
        <AllowedMethod>GET</AllowedMethod>
        <AllowedHeader>content-type</AllowedHeader>
        <ExposeHeader>ETag</ExposeHeader>
        <MaxAgeSeconds>3600</MaxAgeSeconds>
      </CORSRule></CORSConfiguration>"
      curl --silent --show-error --fail-with-body \
        --aws-sigv4 "aws:amz:$${FILE_STORAGE_REGION}:s3" \
        --user "$${FILE_STORAGE_ACCESS_KEY_ID}:$${FILE_STORAGE_SECRET_ACCESS_KEY}" \
        --request PUT --header "Content-Type: application/xml" --data-binary "$${rule}" \
        "http://garage:3900/$${FILE_STORAGE_BUCKET}?cors"
      echo "the bucket $${FILE_STORAGE_BUCKET} accepts files from $${APP_ORIGIN}"

  # What only a superuser can do, done when the data directory is created:
  # the two roles of ADR-0015, the database handed to the migration role, and
  # pg_stat_statements, which is not a trusted extension. Everything after
  # this is a migration.
  postgres-roles:
    content: |
      \getenv migration_password POSTGRES_MIGRATION_PASSWORD
      \getenv api_password POSTGRES_API_PASSWORD
      CREATE ROLE migration LOGIN PASSWORD :'migration_password';
      CREATE ROLE api LOGIN PASSWORD :'api_password';
      ALTER DATABASE :"DBNAME" OWNER TO migration;
      CREATE EXTENSION pg_stat_statements;
