# Development: the services that the API and the app, which run on the
# machine, talk to. Each one extends deploy/compose.base.yaml, which holds the
# tag of every image. Rules: Compose files and Development in
# CODING_STANDARDS.md.
#
# The name is fixed so that every checkout of the repository, a Git worktree
# included, drives the same containers and volumes. Compose creates a
# container again when `up` runs from another directory and the container
# mounts a file of the checkout, because the path differs. PostgreSQL mounts
# none, so that its connections survive: the file it needs is written here, as
# a config with its content. Caddy mounts its Caddyfile, and being created
# again costs it nothing.

name: software-factory-manager

services:
  postgres:
    extends:
      file: deploy/compose.base.yaml
      service: postgres
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT, as .env.example does}:5432

  # The one origin of development: the app from Vite and the API, both on the
  # machine, and /up. What it does is in deploy/Caddyfile.
  caddy:
    extends:
      file: deploy/compose.base.yaml
      service: caddy
    build:
      context: deploy/caddy
    image: software-factory-manager-caddy:development
    ports:
      - 127.0.0.1:${CADDY_PORT:?Set CADDY_PORT, as .env.example does}:80
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      # The API and Vite listen on the machine. Docker Desktop and Docker
      # Engine on Linux each resolve host-gateway to an address of it.
      - host.docker.internal:host-gateway
    environment:
      # Caddy starts the trace of each request but exports nothing until the
      # telemetry containers exist. With no exporter named, it would send to
      # localhost and log each failure.
      OTEL_TRACES_EXPORTER: none

volumes:
  postgres-data:

configs:
  # What only a superuser can do, done when the data directory is created:
  # the two roles of ADR-0015, the database handed to the migration role, and
  # pg_stat_statements, which is not a trusted extension. Everything after
  # this is a migration.
  postgres-roles:
    content: |
      \getenv migration_password POSTGRES_MIGRATION_PASSWORD
      \getenv api_password POSTGRES_API_PASSWORD
      CREATE ROLE migration LOGIN PASSWORD :'migration_password';
      CREATE ROLE api LOGIN PASSWORD :'api_password';
      ALTER DATABASE :"DBNAME" OWNER TO migration;
      CREATE EXTENSION pg_stat_statements;
