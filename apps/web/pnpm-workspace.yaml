# `apps/web` is the only JavaScript package of the repository. This file holds
# its catalog and the settings of pnpm.
#
# One version of each library (see Versions in CODING_STANDARDS.md). Every
# version is exact.
catalog:
  "@babel/core": 8.1.2
  "@base-ui/react": 1.9.0
  "@faker-js/faker": 10.6.0
  "@fontsource-variable/figtree": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@fontsource/poppins": 5.3.0
  "@rolldown/plugin-babel": 0.3.1
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.107.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  "@vitest/browser-playwright": 5.1.0
  babel-plugin-react-compiler: 1.0.0
  class-variance-authority: 0.7.1
  cmdk: 1.1.1
  cn: 0.5.2
  dependency-cruiser: 18.7.2
  i18next: 27.1.3
  input-otp: 1.5.0
  knip: 6.45.1
  lucide-react: 1.73.0
  msw: 3.0.6
  orval: 8.48.0
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 18.0.2
  shadcn: 4.23.0
  tailwindcss: 4.3.5
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  vite-plus: 1.6.0
  vitest-browser-react: 2.3.0
  zod: 4.6.7

# Libraries that import `vite` get the copy inside Vite+. The version is the
# one of `vite-plus` above and changes together with it.
minimumReleaseAgeExclude:
  - i18next@27.1.3
  - react-i18next@18.0.2

overrides:
  "vite@*": npm:@voidzero-dev/vite-plus-core@1.6.0
  # The Vitest that Vite+ bundles, read from `vp toolchain`.
  "vitest@*": 5.1.0

# The copy of Vite inside Vite+ reports the version of Vite+, so a plugin that
# asks for Vite 8 sees 1.6.0. `vp toolchain` shows the Vite it bundles.
peerDependencyRules:
  allowAny:
    - vite

# esbuild comes with orval. Its install script only checks the binary that its
# platform package already brings, so it is not run.
allowBuilds:
  esbuild: false
