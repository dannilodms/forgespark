<!DOCTYPE html>
<html lang="{{.Language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Text.subject}}</title>
</head>
<body style="margin:0;padding:24px;background-color:#f6f7fb;font-family:Arial,Helvetica,sans-serif;color:#323338;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:8px;">
<tr>
<td style="padding:32px;">
<h1 style="margin:0 0 16px;font-size:20px;line-height:28px;">{{.Text.heading}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:24px;">{{.Text.instruction}}</p>
<p style="margin:0 0 16px;font-size:32px;line-height:40px;font-weight:bold;letter-spacing:8px;">{{.Content.Code}}</p>
<p style="margin:0 0 16px;font-size:16px;line-height:24px;">{{.Text.lifetime}}</p>
<p style="margin:0;font-size:14px;line-height:20px;color:#676879;">{{.Text.ignore}}</p>
</td>
</tr>
</table>
</body>
</html>
