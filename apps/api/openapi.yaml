components:
  schemas:
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: The stable code of what is wrong with the field.
          type: string
        location:
          description: "Where the field is: body.name, query.limit, path.id."
          type: string
        message:
          description: What is wrong with the field, in English.
          type: string
        params:
          additionalProperties: {}
          description: The values the text of the code is filled with.
          type: object
      required:
        - location
        - code
        - params
        - message
      type: object
    OpenSetupRequest:
      additionalProperties: false
      properties:
        code:
          description: The setup code, as typed. Case, hyphens and spaces do not count, and O, I and L are read as 0, 1 and 1.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    OpenedSetup:
      additionalProperties: false
      properties:
        expires_at:
          description: When the setup code stops working.
          format: date-time
          type: string
        opens:
          description: What the setup code opens.
          enum:
            - first_setup
          type: string
      required:
        - opens
        - expires_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable code of the failure, which a client translates.
          type: string
        detail:
          description: What went wrong, in English. A client shows a text of its own, chosen by the code.
          type: string
        errors:
          description: The fields that were refused, when the failure is about fields.
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        params:
          additionalProperties: {}
          description: The values the text of the code is filled with.
          type: object
        status:
          description: The status of the answer.
          format: int64
          type: integer
        title:
          description: The name of the status.
          type: string
        trace_id:
          description: The trace identifier of the request, to find it in the logs.
          type: string
      required:
        - title
        - status
        - code
        - params
        - trace_id
      type: object
info:
  description: |-
    The REST contract of the system, generated from the Go code and committed.

    Every failure answers `application/problem+json` with the schema `Problem`. Its `code` is stable and is what a client translates, its `params` fill the translated text, and its `trace_id` finds the request in the logs. Each operation lists, under its statuses, the codes of the rules it can break. Any operation may also answer `bad_request` (400, the body is not JSON), `not_found` (404), `method_not_allowed` (405), `request_timeout` (408, the body took too long to arrive), `request_entity_too_large` (413), `unsupported_media_type` (415), `validation_failed` (422), `too_many_requests` (429) and `internal_server_error` (500).

    An unknown property of a body and an unknown query parameter are rejected with `validation_failed`.
  title: My Software Factory Manager
  version: unversioned
openapi: 3.1.0
paths:
  /api/setup/open:
    post:
      description: Checks a setup code and tells what it opens and when it expires. It saves nothing, and a wrong code changes nothing.
      operationId: open_setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSetupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenedSetup"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity. `setup_code_invalid`: the setup code is wrong, expired or was ended. `validation_failed`: the request does not follow this contract, and `errors` names each field."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Open the setup with a setup code
      tags:
        - Setup
