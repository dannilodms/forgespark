components:
  schemas:
    ConcludeSetupRequest:
      additionalProperties: false
      properties:
        administrator:
          $ref: "#/components/schemas/SetupAdministrator"
          description: Its first administrator, who receives the administrator role.
        code:
          description: The setup code, as typed, as in open_setup.
          maxLength: 64
          minLength: 1
          type: string
        consultancy:
          $ref: "#/components/schemas/SetupConsultancy"
          description: The consultancy.
      required:
        - code
        - consultancy
        - administrator
      type: object
    FieldError:
      additionalProperties: false
      properties:
        code:
          description: The stable code of what is wrong with the field.
          type: string
        location:
          description: "Where the field is: body.name, query.limit, path.id."
          type: string
        message:
          description: What is wrong with the field, in English.
          type: string
        params:
          additionalProperties: {}
          description: The values the text of the code is filled with.
          type: object
      required:
        - location
        - code
        - params
        - message
      type: object
    OpenSetupRequest:
      additionalProperties: false
      properties:
        code:
          description: The setup code, as typed. Case, hyphens and spaces do not count, and O, I and L are read as 0, 1 and 1.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    OpenedSetup:
      additionalProperties: false
      properties:
        expires_at:
          description: When the setup code stops working.
          format: date-time
          type: string
        opens:
          description: "What the setup code opens: the first setup while the setup is not concluded, and the registration of a new administrator once it is."
          enum:
            - first_setup
            - new_administrator
          type: string
      required:
        - opens
        - expires_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable code of the failure, which a client translates.
          type: string
        detail:
          description: What went wrong, in English. A client shows a text of its own, chosen by the code.
          type: string
        errors:
          description: The fields that were refused, when the failure is about fields.
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        params:
          additionalProperties: {}
          description: The values the text of the code is filled with.
          type: object
        status:
          description: The status of the answer.
          format: int64
          type: integer
        title:
          description: The name of the status.
          type: string
        trace_id:
          description: The trace identifier of the request, to find it in the logs.
          type: string
      required:
        - title
        - status
        - code
        - params
        - trace_id
      type: object
    RegisterAdministratorRequest:
      additionalProperties: false
      properties:
        administrator:
          $ref: "#/components/schemas/SetupAdministrator"
          description: The new administrator, who receives the administrator role.
        code:
          description: The setup code, as typed, as in open_setup.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
        - administrator
      type: object
    SetupAddress:
      additionalProperties: false
      properties:
        city:
          description: The city.
          maxLength: 100
          type: string
        line1:
          description: "The first line: the street and the number."
          maxLength: 200
          type: string
        line2:
          description: "The second line: the suite, the floor, the building."
          maxLength: 200
          type: string
        postal_code:
          description: The postal code, as the country writes it.
          maxLength: 20
          type: string
        region:
          description: "The region: a state, a province, a county."
          maxLength: 100
          type: string
      type: object
    SetupAdministrator:
      additionalProperties: false
      properties:
        country:
          description: "The country that gave the national ID, by its ISO 3166-1 alpha-2 code: BR."
          minLength: 1
          type: string
        email:
          description: The e-mail the administrator logs in with. It is stored in lowercase, and belongs to one user.
          format: email
          maxLength: 254
          minLength: 1
          type: string
        name:
          description: The name of the person.
          maxLength: 200
          minLength: 1
          type: string
        national_id:
          description: The identifier the country gives the person, as the country writes it.
          maxLength: 50
          minLength: 1
          type: string
        photo_file_id:
          description: The file of the photo, as start_setup_upload answered it, once the image was sent to the storage.
          pattern: ^fil_[0-9A-Za-z]{8,}$
          type: string
        preferred_language:
          description: "The supported language the administrator reads the system in: the language the setup screen was in."
          enum:
            - en-US
            - es
            - pt-BR
          minLength: 1
          type: string
        telephone:
          description: "The telephone, in international form: a plus sign and 7 to 15 digits. Spaces are dropped."
          pattern: ^\+( *[0-9]){7,15} *$
          type: string
      required:
        - name
        - email
        - country
        - national_id
        - preferred_language
      type: object
    SetupConsultancy:
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/SetupAddress"
          description: The address. Every part may be left out.
        country:
          description: "The country, by its ISO 3166-1 alpha-2 code: BR."
          minLength: 1
          type: string
        currency:
          description: "The currency, by its ISO 4217 code: BRL."
          minLength: 1
          type: string
        email:
          description: The e-mail of the consultancy. It is stored in lowercase.
          format: email
          maxLength: 254
          type: string
        legal_name:
          description: The name documents carry.
          maxLength: 200
          minLength: 1
          type: string
        logo_file_id:
          description: The file of the logo, as start_setup_upload answered it, once the image was sent to the storage.
          pattern: ^fil_[0-9A-Za-z]{8,}$
          type: string
        name:
          description: The name the consultancy is known by.
          maxLength: 200
          minLength: 1
          type: string
        tax_id:
          description: The identifier the tax authority of the country gives the consultancy, as the country writes it.
          maxLength: 50
          minLength: 1
          type: string
        telephone:
          description: "The telephone, in international form: a plus sign and 7 to 15 digits. Spaces are dropped."
          pattern: ^\+( *[0-9]){7,15} *$
          type: string
        time_zone:
          description: "The time zone, by its name in the IANA time zone database: America/Sao_Paulo."
          minLength: 1
          type: string
        website:
          description: "The website: an http or https address."
          maxLength: 2048
          pattern: ^https?://[^\s/?#@]+([/?#]\S*)?$
          type: string
      required:
        - name
        - legal_name
        - country
        - tax_id
        - time_zone
        - currency
      type: object
    SetupState:
      additionalProperties: false
      properties:
        concluded:
          description: "Whether the setup is concluded: the consultancy and its first administrator exist."
          type: boolean
        setup_code_waiting:
          description: Whether a setup code is issued and still works, before the setup is concluded or after.
          type: boolean
      required:
        - concluded
        - setup_code_waiting
      type: object
    SetupUpload:
      additionalProperties: false
      properties:
        expires_at:
          description: "When the URL stops working: five minutes after it was signed."
          format: date-time
          type: string
        file_id:
          description: The identifier of the file, which concluding the setup takes as logo_file_id or as photo_file_id.
          pattern: ^fil_[0-9A-Za-z]{8,}$
          type: string
        upload_url:
          description: "Where the browser sends the image, with a PUT from the origin of the app: the Content-Type is the declared type and the body has the declared size. The URL is signed for the host name of the file storage."
          format: uri
          type: string
      required:
        - file_id
        - upload_url
        - expires_at
      type: object
    StartSetupUploadRequest:
      additionalProperties: false
      properties:
        code:
          description: The setup code, as typed, as in open_setup.
          maxLength: 64
          minLength: 1
          type: string
        media_type:
          description: The type of the image. The browser sends it as the Content-Type of its PUT.
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        purpose:
          description: "What the image is for: the logo of the consultancy or the photo of its administrator."
          enum:
            - consultancy_logo
            - user_photo
          type: string
        size:
          description: The size of the image, in bytes. The browser sends exactly this many.
          format: int64
          maximum: 2097152
          minimum: 1
          type: integer
      required:
        - code
        - purpose
        - media_type
        - size
      type: object
info:
  description: |-
    The REST contract of the system, generated from the Go code and committed.

    Every failure answers `application/problem+json` with the schema `Problem`. Its `code` is stable and is what a client translates, its `params` fill the translated text, and its `trace_id` finds the request in the logs. Each operation lists, under its statuses, the codes of the rules it can break. Any operation may also answer `bad_request` (400, the body is not JSON), `not_found` (404), `method_not_allowed` (405), `request_timeout` (408, the body took too long to arrive), `request_entity_too_large` (413), `unsupported_media_type` (415), `validation_failed` (422), `too_many_requests` (429) and `internal_server_error` (500).

    An unknown property of a body and an unknown query parameter are rejected with `validation_failed`.
  title: My Software Factory Manager
  version: unversioned
openapi: 3.1.0
paths:
  /api/setup:
    get:
      description: Tells whether the setup is concluded and whether a setup code is waiting. It needs no session.
      operationId: tell_setup_state
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Tell the state of the setup
      tags:
        - Setup
  /api/setup/administrators:
    post:
      description: "The way back in when no administrator can log in: with a setup code issued after the setup was concluded, registers a new user with the administrator role and ends the setup code. No user that exists is changed, and an e-mail that belongs to one is refused, whether that user is deactivated or not. Every field is checked before anything is saved. The photo, when given, is confirmed as in conclude_setup. The answer has no body and no Location: no operation reads a user yet."
      operationId: register_administrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAdministratorRequest"
        required: true
      responses:
        "201":
          description: Created
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Conflict. `setup_not_concluded`: the setup is not concluded. `email_in_use`: the e-mail belongs to a user."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity. `setup_code_invalid`: the setup code is wrong, expired or was ended. `validation_failed`: the request does not follow this contract, or a field breaks a rule, and `errors` names each field with the code `required` or `invalid`, or the code of the rule. The rules of a field: `required`: the field is required. `too_long`: the text is longer than the field allows. `country_unknown`: the country is not an ISO 3166-1 alpha-2 code. `language_unsupported`: the language is not a supported language. `email_invalid`: the text is not an e-mail address. `telephone_invalid`: the text is not a telephone in international form: a plus sign and 7 to 15 digits. `file_not_found`: no file of this kind has this identifier. `file_not_uploaded`: the file was never sent to the storage. `file_too_large`: the file is larger than 2097152 bytes. `file_type_unsupported`: the file is not a PNG, a JPEG or a WebP image."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests. `too_many_requests`: too many requests from this address, answered by Caddy before the API; the header Retry-After says how many seconds to wait."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Register a new administrator with a setup code
      tags:
        - Setup
  /api/setup/conclude:
    post:
      description: "Registers the consultancy, its first administrator and the two first roles together, and ends the setup code. Every field is checked before anything is saved, and nothing is saved when one breaks a rule. The logo and the photo, when given, are confirmed: each must have been sent to the storage, and be an image within the limits."
      operationId: conclude_setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConcludeSetupRequest"
        required: true
      responses:
        "204":
          description: No Content
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Conflict. `setup_already_concluded`: the setup is already concluded."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity. `setup_code_invalid`: the setup code is wrong, expired or was ended. `validation_failed`: the request does not follow this contract, or a field breaks a rule, and `errors` names each field with the code `required` or `invalid`, or the code of the rule. The rules of a field: `required`: the field is required. `too_long`: the text is longer than the field allows. `country_unknown`: the country is not an ISO 3166-1 alpha-2 code. `currency_unknown`: the currency is not the ISO 4217 code of a currency in circulation. `time_zone_unknown`: the time zone is not a name of the IANA time zone database. `language_unsupported`: the language is not a supported language. `email_invalid`: the text is not an e-mail address. `telephone_invalid`: the text is not a telephone in international form: a plus sign and 7 to 15 digits. `website_invalid`: the text is not an http or https address. `file_not_found`: no file of this kind has this identifier. `file_not_uploaded`: the file was never sent to the storage. `file_too_large`: the file is larger than 2097152 bytes. `file_type_unsupported`: the file is not a PNG, a JPEG or a WebP image."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests. `too_many_requests`: too many requests from this address, answered by Caddy before the API; the header Retry-After says how many seconds to wait."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Conclude the first setup
      tags:
        - Setup
  /api/setup/open:
    post:
      description: Checks a setup code and tells what it opens and when it expires. It saves nothing, and a wrong code changes nothing.
      operationId: open_setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSetupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenedSetup"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity. `setup_code_invalid`: the setup code is wrong, expired or was ended. `validation_failed`: the request does not follow this contract, or a field breaks a rule, and `errors` names each field with the code `required` or `invalid`, or the code of the rule."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests. `too_many_requests`: too many requests from this address, answered by Caddy before the API; the header Retry-After says how many seconds to wait."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Open the setup with a setup code
      tags:
        - Setup
  /api/setup/uploads:
    post:
      description: "Checks the setup code and the type and size declared, creates the file of the logo of the consultancy or of the photo of its administrator, and answers a URL of the file storage, signed for five minutes. The browser sends the image there itself, with a PUT whose Content-Type is the declared type and whose body has the declared size; the image never passes through the API. Concluding the setup takes the identifier of the file and confirms the image. The logo belongs to the first setup: a setup code issued after the setup was concluded starts the upload of the photo of the new administrator only."
      operationId: start_setup_upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSetupUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupUpload"
          description: Created
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Conflict. `setup_already_concluded`: the setup is already concluded."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity. `setup_code_invalid`: the setup code is wrong, expired or was ended. `validation_failed`: the request does not follow this contract, or a field breaks a rule, and `errors` names each field with the code `required` or `invalid`, or the code of the rule. The rules of a field: `file_type_unsupported`: the file is not a PNG, a JPEG or a WebP image. `file_too_large`: the file is larger than 2097152 bytes. `file_empty`: the file has no byte."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests. `too_many_requests`: too many requests from this address, answered by Caddy before the API; the header Retry-After says how many seconds to wait."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error. `internal_server_error`: the failure is in the logs, under the `trace_id`."
      summary: Start the upload of an image of the setup
      tags:
        - Setup
