openapi: 3.1.0
info:
  title: A spec that keeps every convention
  version: unversioned
paths:
  /api/setup:
    get:
      operationId: read_setup
      responses:
        "200":
          description: OK
  /api/setup/open:
    post:
      operationId: open_setup
      responses:
        "200":
          description: OK
  /api/setup/uploads:
    post:
      operationId: start_setup_upload
      responses:
        "201":
          description: Created
  /api/health:
    get:
      operationId: read_health
      responses:
        "200":
          description: OK
  /api/projects:
    get:
      operationId: list_projects
      parameters:
        - name: sort_by
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      operationId: create_project
      responses:
        "201":
          description: Created
  /api/projects/{project_id}:
    get:
      operationId: read_project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /api/projects/{project_id}/cancel:
    post:
      operationId: cancel_project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    Project:
      type: object
      properties:
        $schema:
          type: string
        legal_name:
          type: string
        tax_id:
          type: string
        line2:
          type: string
        address:
          type: object
          properties:
            postal_code:
              type: string
