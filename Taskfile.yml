version: "3"

tasks:
  install:
    desc: Install the JavaScript dependencies
    cmds:
      - vp install

  prototype:
    desc: Start the clickable prototype
    dir: apps/prototype
    cmds:
      - vp dev

  check:
    desc: Format, lint and type checks of the JavaScript workspace
    cmds:
      - vp check

  check:fix:
    desc: The same checks, fixing what can be fixed
    cmds:
      - vp check --fix
