version: "3"

tasks:
  install:
    desc: Install the JavaScript dependencies
    cmds:
      - vp install

  prototype:
    desc: Start the clickable prototype
    dir: apps/prototype
    cmds:
      - vp dev

  check:
    desc: Format, lint and type checks, the coverage of the gallery, the missing translation keys and the tests of the prototype
    cmds:
      - vp check
      - vp node apps/prototype/scripts/gallery-coverage.mjs
      - vp node apps/prototype/scripts/missing-keys.mjs
      - vp test run --root apps/prototype

  check:fix:
    desc: Format, lint and type checks, fixing what can be fixed
    cmds:
      - vp check --fix
