version: "3"

tasks:
  install:
    desc: Install the JavaScript dependencies of the app
    dir: apps/web
    cmds:
      - vp install

  dev:
    desc: Start the app
    dir: apps/web
    cmds:
      - vp dev

  check:
    desc: Format, lint and type checks, the missing translation keys and the tests of the app
    dir: apps/web
    cmds:
      - vp check
      - vp node scripts/missing-keys.mjs
      - vp test run

  check:fix:
    desc: Format, lint and type checks, fixing what can be fixed
    dir: apps/web
    cmds:
      - vp check --fix
